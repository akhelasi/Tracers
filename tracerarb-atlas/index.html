<body>
  <div class="arjs-loader">
    <div>
      <img src="./assets/images/tracer-image.png" alt="Loading Image">
      <div>Based on Tracer Technology</div>
      <div>NEC © 2025</div>
    </div>
    <div id="loadingText">Loading, please wait...</div>
  </div>

  <div id="logoContainer">
    <img id="tracerLogo" src="./assets/images/tracer-image.png" alt="tracerLogo Image">
  </div>

  <!-- "Memory" Button -->
  <div id="memory-button-container">

            smooth="true" 
            smoothcount="60"
            smoothtolerance="30" 
            smooththreshold="50"
            size="0.1699 0.1116"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
            id="marker1"

                position="1 0 0"
